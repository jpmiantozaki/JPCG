# Staging-only: sensitive ?data= URLs must not appear in access logs.
# Does NOT control Render edge, Cloudflare, CDN, APM or upstream logging.
<VirtualHost *:80>
    DocumentRoot /opt/cgm-upstream/public
    <Directory /opt/cgm-upstream/public>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>
    ErrorLog /proc/self/fd/2
    LogFormat "%t %m %U %>s %B" cgm_path_only
    CustomLog /proc/self/fd/1 cgm_path_only
</VirtualHost>
