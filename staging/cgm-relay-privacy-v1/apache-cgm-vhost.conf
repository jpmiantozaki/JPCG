# STAGING-ONLY Apache virtual host for CGM relay privacy validation.
# Do NOT log request lines (%r), query strings (%q), user-supplied request
# headers, IP address, cookies, tokens, or user names.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    LogFormat "%t \"%m %U %H\" %>s %B" cgm_path_only
    CustomLog /proc/self/fd/1 cgm_path_only
</VirtualHost>
