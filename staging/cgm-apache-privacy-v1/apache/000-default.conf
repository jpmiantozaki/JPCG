# STAGING: replace php:8.3-apache default site to suppress GET query values in Apache access logs.
# %U = path only. Avoid %r, %q, Referer and headers.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogFormat "time=%t method=%m path=%U status=%>s bytes=%B" cgm_path_only
    CustomLog ${APACHE_LOG_DIR}/access.log cgm_path_only
</VirtualHost>
