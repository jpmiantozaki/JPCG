<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CGM Solo VIP administration</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#17151c;color:#f0e7ec}*{box-sizing:border-box}body{max-width:1050px;margin:36px auto;padding:0 18px}a{color:#e5bc78}h1{font-size:24px;margin-bottom:8px}p{color:#c6b8c0;line-height:1.5}section{background:#28212d;border:1px solid #534254;padding:22px;border-radius:12px;margin-top:20px}label{display:block;color:#e7d7e0;font-size:13px;margin:12px 0 6px}input{width:100%;padding:11px;background:#19151c;color:#fff;border:1px solid #66526a;border-radius:6px}button{padding:10px 16px;background:#d8b36f;border:0;border-radius:6px;color:#241922;font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:wait}button.secondary{background:#483747;color:#fff}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:200px}#message{white-space:pre-wrap;overflow-wrap:anywhere}#code{font-family:monospace;overflow-wrap:anywhere;color:#f2cf85;font-size:18px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #483847;vertical-align:top}th{color:#d5becd}td{overflow-wrap:anywhere}.table{overflow:auto}small{color:#b9a5b2}
</style><body><a href="admin_panel.html">Back to existing CGM administration</a><h1>CGM / Solo VIP</h1><p>Issue a one-time Solo license for an exact account email. Mobile codes and memberships are managed separately.</p><section><label for="key">Existing JPCG admin key</label><input id="key" type="password" autocomplete="off" placeholder="Not saved by this page"><div class="row"><div><label for="email">Assigned login email</label><input id="email" type="email" placeholder="player@example.com" autocomplete="off"></div><div><label for="days">VIP duration (days)</label><input id="days" type="number" value="30" min="1" max="3650" step="1"></div></div><p><button id="generate">Generate Solo VIP code</button> <button class="secondary" id="refresh">Refresh memberships</button></p><div id="message" role="status"></div><div id="code"></div><p id="copyrow" hidden><button id="copy" class="secondary">Copy code</button> <small>Save or deliver the code now. Only a hash and masked hint are stored.</small></p></section><section><h2 style="font-size:17px">Recent Solo memberships</h2><div class="table"><table><thead><tr><th>Email</th><th>Code hint</th><th>Days</th><th>Status</th><th>Expiry</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>'use strict';const $=id=>document.getElementById(id);let pending=false;const show=s=>{$('message').textContent=s};async function api(payload){const key=$('key').value;if(!key)throw Error('Enter your existing admin key.');const response=await fetch('solo_admin.php',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify(payload),cache:'no-store',redirect:'error',credentials:'same-origin'});const data=await response.json();if(!response.ok||data.ok!==true)throw Error('Request rejected: '+String(data.error||response.status));return data}
function td(row,value){const cell=document.createElement('td');cell.textContent=String(value);row.append(cell);return cell}async function load(){const j=await api({action:'list'});$('rows').replaceChildren();for(const r of j.codes){const row=document.createElement('tr');const state=r.revoked_at!==null?'REVOKED':r.redeemed_at===null?'UNUSED':Number(r.vip_expiry)>j.server_time?'ACTIVE':'EXPIRED';td(row,r.email);td(row,r.code_hint);td(row,r.vip_days);td(row,state);td(row,r.vip_expiry===null?'—':new Date(Number(r.vip_expiry)*1000).toLocaleString());const cell=td(row,'');if(state!=='REVOKED'){const b=document.createElement('button');b.className='secondary';b.textContent='Revoke';b.onclick=()=>run(async()=>{if(confirm('Revoke this Solo code?')){await api({action:'revoke',code_id:r.code_id});await load();show('Solo code revoked.')}});cell.append(b)}$('rows').append(row)}}
async function run(task){if(pending)return;pending=true;$('generate').disabled=$('refresh').disabled=true;try{await task()}catch(e){show(e.message)}finally{pending=false;$('generate').disabled=$('refresh').disabled=false}}
$('generate').onclick=()=>run(async()=>{const email=$('email').value.trim();const days=Number($('days').value);if(!email||!Number.isInteger(days)||days<1||days>3650)throw Error('Enter an email and 1–3650 days.');$('code').textContent='';$('copyrow').hidden=true;const j=await api({action:'generate',email,days});$('code').textContent=j.code;$('copyrow').hidden=false;show('Generated for '+j.email+'. Copy before leaving this page.');await load()});$('refresh').onclick=()=>run(async()=>{await load();show('Memberships refreshed.')});$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('code').textContent);show('Code copied.')}catch(e){show('Select the generated code and copy manually.')}};
</script></body></html>
