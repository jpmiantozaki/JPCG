name: CGM Auth-First Pure C# Source Policy (No Game Access)
on:
  push:
    branches:
      - feat/phase28-5-authfirst-gate-hardened
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-policy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and exercise original C# policy file
        run: dotnet run --project staging/cgm-authfirst-source-gate-v2/tests/csharp/PolicyRuntimeTests.csproj --configuration Release
