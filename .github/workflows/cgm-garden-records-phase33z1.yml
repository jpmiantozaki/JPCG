name: CGM Phase33Z1 Garden Typed Records (Staging)
on:
  push:
    branches:
      - feat/phase33z1-garden-record-layout
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Syntax verification
        run: |
          php -l staging/cgm-upstream-foundation-v1/src/CgmC8Subtype02Structure.php
          php -l staging/cgm-upstream-foundation-v1/src/CgmC8Subtype02RecordLayout.php
          php -l staging/cgm-upstream-foundation-v1/tests/c8_record_layout_test.php
      - name: Validate 3087 original-layout synthetic assertions
        run: php staging/cgm-upstream-foundation-v1/tests/c8_record_layout_test.php
