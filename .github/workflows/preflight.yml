name: CGM repository preflight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Syntax-check tracked PHP
        run: git ls-files -z '*.php' | xargs -0 -r -n 1 php -l
      - name: Run offline contract tests
        run: python3 -m unittest discover -s tests -v
